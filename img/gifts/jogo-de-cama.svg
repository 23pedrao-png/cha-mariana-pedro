<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F5F0"/>
      <stop offset="100%" stop-color="#EFE8DF"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#B98470" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#dots)"/>
  <rect x="28" y="28" width="584" height="424" fill="none" stroke="#B39A84" stroke-width="1.2" opacity="0.55"/>
  <rect x="36" y="36" width="568" height="408" fill="none" stroke="#B98470" stroke-width="0.6" opacity="0.35"/>
  
  <g transform="translate(320 250)" fill="none" stroke="#8A4F3D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="150" rx="200" ry="14" fill="#E8DDD3" stroke="none" opacity="0.55"/>
    <!-- mattress / bed -->
    <path d="M-210 70 h420 v50 h-420 z" fill="#E8DDD3"/>
    <path d="M-210 70 q0 -90 80 -90 h250 q90 0 90 90" fill="#F4EEE7"/>
    <!-- blanket fold -->
    <path d="M-120 70 q80 -50 220 0 v20 q-130 -40 -220 0 z" fill="#B98470" opacity="0.85"/>
    <!-- pillows -->
    <rect x="-160" y="-50" width="140" height="70" rx="16" fill="#FAF7F2"/>
    <rect x="20" y="-50" width="140" height="70" rx="16" fill="#FAF7F2"/>
    <rect x="-148" y="-38" width="116" height="46" rx="10" fill="#EDE2D8" stroke="none"/>
    <rect x="32" y="-38" width="116" height="46" rx="10" fill="#EDE2D8" stroke="none"/>
    <!-- headboard -->
    <path d="M-200 -70 q0 -70 80 -90 h240 q80 20 80 90" fill="none" stroke="#B39A84" stroke-width="5"/>
  </g>

</svg>
