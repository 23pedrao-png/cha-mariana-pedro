<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7EFE6"/>
      <stop offset="100%" stop-color="#EEDFD6"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C0807A" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#dots)"/>
  <rect x="28" y="28" width="584" height="424" fill="none" stroke="#B8956A" stroke-width="1.2" opacity="0.55"/>
  <rect x="36" y="36" width="568" height="408" fill="none" stroke="#C0807A" stroke-width="0.6" opacity="0.35"/>
  
  <g transform="translate(320 250)" fill="none" stroke="#5C3030" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="155" rx="130" ry="12" fill="#E8D0C8" stroke="none" opacity="0.7"/>
    <!-- base -->
    <path d="M-110 80 h180 q20 0 20 20 v20 h-230 v-20 q0 -20 30 -20 z" fill="#3D2C2E"/>
    <!-- bowl -->
    <path d="M-80 20 q0 70 50 80 q50 -10 50 -80 z" fill="#F7E8E0"/>
    <ellipse cx="-30" cy="20" rx="50" ry="12" fill="#FAF3EC"/>
    <!-- arm -->
    <path d="M40 80 v-140 q0 -20 20 -20 h70 v30 h-40 v130" fill="#C0807A"/>
    <rect x="20" y="-20" width="70" height="36" rx="10" fill="#B8956A" stroke="#5C3030"/>
    <!-- beaters -->
    <path d="M-10 -10 v50"/>
    <path d="M10 -10 v50"/>
    <path d="M-22 30 q12 20 24 0 q12 20 24 0" />
  </g>

</svg>
