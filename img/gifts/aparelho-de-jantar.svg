<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7EFE6"/>
      <stop offset="100%" stop-color="#EEDFD6"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C0807A" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#dots)"/>
  <rect x="28" y="28" width="584" height="424" fill="none" stroke="#B8956A" stroke-width="1.2" opacity="0.55"/>
  <rect x="36" y="36" width="568" height="408" fill="none" stroke="#C0807A" stroke-width="0.6" opacity="0.35"/>
  
  <g transform="translate(320 250)" fill="none" stroke="#5C3030" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="155" rx="180" ry="12" fill="#E8D0C8" stroke="none" opacity="0.6"/>
    <ellipse cx="0" cy="10" rx="170" ry="70" fill="#F7E8E0"/>
    <ellipse cx="0" cy="10" rx="150" ry="56" fill="#FAF3EC" stroke="#B8956A" stroke-width="3"/>
    <ellipse cx="0" cy="10" rx="70" ry="26" fill="#F0D9D2" stroke="#C0807A" stroke-width="2.5"/>
    <!-- stacked plates behind -->
    <ellipse cx="0" cy="-50" rx="140" ry="28" fill="#F4E6DC"/>
    <ellipse cx="0" cy="-68" rx="140" ry="28" fill="#EED9CF"/>
    <!-- bowl -->
    <g transform="translate(150 -80) scale(0.55)">
      <path d="M-70 0 h140 l-16 50 h-108 z" fill="#F7E8E0"/>
      <ellipse cx="0" cy="0" rx="70" ry="14" fill="#FAF3EC"/>
    </g>
  </g>

</svg>
