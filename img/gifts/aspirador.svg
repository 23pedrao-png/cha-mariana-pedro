<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7EFE6"/>
      <stop offset="100%" stop-color="#EEDFD6"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C0807A" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#dots)"/>
  <rect x="28" y="28" width="584" height="424" fill="none" stroke="#B8956A" stroke-width="1.2" opacity="0.55"/>
  <rect x="36" y="36" width="568" height="408" fill="none" stroke="#C0807A" stroke-width="0.6" opacity="0.35"/>
  
  <g transform="translate(320 245)" fill="none" stroke="#5C3030" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="20" cy="160" rx="140" ry="12" fill="#E8D0C8" stroke="none" opacity="0.7"/>
    <!-- stick -->
    <rect x="-12" y="-150" width="24" height="200" rx="8" fill="#3D2C2E"/>
    <rect x="-22" y="-170" width="44" height="36" rx="10" fill="#B8956A" />
    <!-- body -->
    <path d="M-50 40 h100 l20 70 h-140 z" fill="#F4E6DC"/>
    <circle cx="0" cy="70" r="22" fill="#C0807A" stroke="#5C3030"/>
    <circle cx="0" cy="70" r="8" fill="#FAF3EC" stroke="#5C3030" stroke-width="3"/>
    <!-- head -->
    <path d="M-110 130 h220 q10 0 10 16 h-240 q0 -16 10 -16 z" fill="#3D2C2E"/>
    <path d="M-90 146 h180" stroke="#B8956A" stroke-width="3"/>
