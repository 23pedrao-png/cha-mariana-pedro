    <path d="M-50 40 h100 l20 70 h-140 z" fill="#F3EDE5"/>
    <circle cx="0" cy="70" r="22" fill="#B98470" stroke="#8A4F3D"/>
    <circle cx="0" cy="70" r="8" fill="#FAF7F2" stroke="#8A4F3D" stroke-width="3"/>
    <!-- head -->
    <path d="M-110 130 h220 q10 0 10 16 h-240 q0 -16 10 -16 z" fill="#4A2F26"/>
    <path d="M-90 146 h180" stroke="#B39A84" stroke-width="3"/>
